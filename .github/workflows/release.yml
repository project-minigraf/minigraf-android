name: Android Release

on:
  repository_dispatch:
    types: [core-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true

jobs:
  prepare:
    name: Pin version, commit, tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      semver: ${{ steps.ver.outputs.semver }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}

      - id: ver
        run: |
          V="${{ github.event.client_payload.version || github.event.inputs.version }}"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "semver=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Pin minigraf version in Cargo.toml
        run: |
          sed -i 's/^minigraf = "[^"]*"/minigraf = "=${{ steps.ver.outputs.semver }}"/' Cargo.toml
          sed -i 's/\(minigraf = {[^}]*version = \"\)[^\"]*/\1=${{ steps.ver.outputs.semver }}/' Cargo.toml

      - name: Wait for minigraf ${{ steps.ver.outputs.semver }} on crates.io
        run: |
          SEMVER="${{ steps.ver.outputs.semver }}"
          echo "Waiting for minigraf@$SEMVER on crates.io..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s "https://crates.io/api/v1/crates/minigraf/$SEMVER" \
              -H "User-Agent: minigraf-binding/1.0" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('version',{}).get('num',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "$SEMVER" ]; then
              echo "minigraf@$SEMVER is live (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/20: not yet available, waiting 15s..."
            sleep 15
          done
          echo "ERROR: minigraf@$SEMVER not found on crates.io after 5 minutes" >&2
          exit 1
      - name: Update Cargo.lock
        run: cargo update --precise "${{ steps.ver.outputs.semver }}" minigraf

      - name: Stamp the version in the README install snippet
        run: sed -i 's/\(minigraf-android:\)[^"]*"/\1${{ steps.ver.outputs.semver }}"/' README.md

      # Push the pin commit to a throwaway branch only. The tag and main are
      # updated by the tag job, after the test job has passed on this commit.
      - name: Commit and push release branch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "Cargo.toml already pinned, skipping commit"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push --force origin "HEAD:refs/heads/release/${{ steps.ver.outputs.tag }}"

  # Run this binding's test suite against the exact pinned core version before
  # anything becomes visible: no tag, no main update, no publish until it passes.
  test:
    name: Test pinned release
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # The AAR is built and consumer-tested here, stamped with the release
      # version; publish rebuilds it from the same inputs and checks it matches.
      version: ${{ needs.prepare.outputs.semver }}

  tag:
    name: Push tag and update main
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          token: ${{ secrets.MINIGRAF_RELEASE_TOKEN }}
          # Parent commit (= main) so git can verify the main push is a fast-forward.
          fetch-depth: 2

      - name: Push tag, fast-forward main, delete release branch
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          EXISTING=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -z "$EXISTING" ]; then
            REFS=("$SHA:refs/heads/main" "$SHA:refs/tags/$TAG")
          elif [ "$EXISTING" = "$SHA" ]; then
            echo "Tag $TAG already points at $SHA, skipping tag push"
            REFS=("$SHA:refs/heads/main")
          else
            echo "::error::Tag $TAG already exists at $EXISTING, but the tested commit is $SHA. Delete the tag and re-run to release the tested commit."
            exit 1
          fi
          # Atomic: main and the tag move together or not at all. Rejected if
          # main moved during the release; re-run to re-pin on the new main.
          git push --atomic origin "${REFS[@]}"
          git push origin --delete "release/$TAG" \
            || echo "::warning::Could not delete branch release/$TAG"

  publish:
    name: Publish the tested AAR to Maven Central
    needs: [prepare, test, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The native libraries and Kotlin sources the tested AAR was built from.
      - uses: actions/download-artifact@v4
        with:
          name: dist-aar-inputs
          path: android

      - uses: actions/download-artifact@v4
        with:
          name: dist-aar
          path: tested

      # nmcp publishes from the Gradle publication, so the AAR is rebuilt from
      # the tested inputs (no Rust build here) and must be byte-identical to
      # the AAR the consumer test ran. package.yml checks on every PR that the
      # build is reproducible.
      - name: Rebuild from the tested inputs and compare
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.semver }}
        run: |
          cd android && ./gradlew --no-daemon publishReleasePublicationToDistRepository && cd ..
          DIR=io/github/project-minigraf/minigraf-android/$RELEASE_VERSION
          # Same files, then same bytes. Signing is off in this step; the
          # publish step adds only the .asc signatures.
          diff <(ls "tested/$DIR") <(ls "android/build/m2/$DIR") \
            || { echo "::error::the rebuild publishes a different set of files"; exit 1; }
          for f in tested/$DIR/*; do
            case "$f" in *.md5|*.sha1|*.sha256|*.sha512) continue ;; esac
            cmp "$f" "android/build/m2/$DIR/$(basename "$f")" \
              || { echo "::error::$(basename "$f") differs from the tested artifact"; exit 1; }
          done
          echo "Rebuilt artifacts are identical to the tested ones"

      - name: Sign and publish to Maven Central
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.semver }}
        run: cd android && ./gradlew --no-daemon publishAllPublicationsToCentralPortal

  # Installs the published version from Maven Central and runs the consumer
  # test; on failure the run fails and a release-broken issue is opened.
  verify-published:
    name: Verify the published AAR
    needs: [prepare, publish]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.prepare.outputs.semver }}
      ref: ${{ needs.prepare.outputs.tag }}
