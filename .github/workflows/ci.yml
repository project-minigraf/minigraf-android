name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (release.yml passes the pinned release tag)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version stamped into the artifacts (release.yml passes the release version)'
        required: false
        type: string
        default: '0.0.0-ci'

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  package:
    name: Package
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ inputs.ref }}
      version: ${{ inputs.version || '0.0.0-ci' }}

  # Installs the built AAR into an app through its Maven coordinates and runs
  # the README quick start and the consumer contract on an emulator.
  consumer:
    name: Consumer test (API ${{ matrix.api-level }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/download-artifact@v4
        with:
          name: dist-aar
          path: dist-aar

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run consumer test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash consumer-test/run.sh local dist-aar ${{ inputs.version || '0.0.0-ci' }}

  readme-sync:
    name: README quick start matches the consumer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: python3 -I consumer-test/readme_sync.py README.md consumer-test/tests/quickstart.kt
