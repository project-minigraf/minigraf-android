name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to test (release.yml passes the pinned release tag)'
        required: false
        type: string
        default: ''

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  android-build:
    name: Android cross-compile smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cross-compile Android targets
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o android/jniLibs \
            build --release

      - name: Generate Kotlin bindings
        run: |
          cargo run --bin uniffi-bindgen -- generate \
            --library target/aarch64-linux-android/release/libminigraf_ffi.so \
            --language kotlin \
            --out-dir android/src/main/java/

      - name: Assemble AAR
        run: cd android && ./gradlew assembleRelease

      # nmcp names the Maven Central deployment "<project.name>-<project.version>.zip",
      # so project.version (not just the publication version) must carry RELEASE_VERSION.
      - name: Check project version follows RELEASE_VERSION
        env:
          RELEASE_VERSION: 0.0.0-ci
        run: |
          cd android
          ./gradlew -q properties | tee props.txt | grep -x 'version: 0.0.0-ci' \
            || { grep '^version:' props.txt; echo "::error::project.version does not follow RELEASE_VERSION"; exit 1; }
